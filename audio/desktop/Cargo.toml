[package]
name = "bukospeak-audio-desktop"
description = "Plays a BukoSpeak call on a desktop's audio devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
bukospeak-core.workspace = true
cpal.workspace = true
rubato.workspace = true
thiserror.workspace = true

[lints]
workspace = true

# On Linux the sound server's devices, named as the system names them and following its default;
# ALSA lists every plug and alias of each card instead.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pulseaudio"] }
