[package]
name = "bukospeak-desktop"
description = "The BukoSpeak desktop app, and `bukospeak`, a terminal client for trying the server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
bukospeak-core = { workspace = true, features = ["deepfilter"] }
anyhow.workspace = true
clap.workspace = true
cpal.workspace = true
ctrlc.workspace = true
dirs.workspace = true
futures.workspace = true
global-hotkey.workspace = true
gpui-kit.workspace = true
interprocess.workspace = true
keyring.workspace = true
rubato.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
velopack.workspace = true

# On Linux the sound server's devices, named as the system names them and following its default;
# ALSA lists every plug and alias of each card instead.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pulseaudio"] }
ksni.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
bukospeak-server.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
