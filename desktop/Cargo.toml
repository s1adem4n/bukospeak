[package]
name = "bukospeak-desktop"
description = "The BukoSpeak desktop app, and `bukospeak`, a terminal client for trying the server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
bukospeak-core = { workspace = true, features = ["deepfilter"] }
bukospeak-maxine.workspace = true
anyhow.workspace = true
auto-launch.workspace = true
clap.workspace = true
cpal.workspace = true
ctrlc.workspace = true
dirs.workspace = true
futures.workspace = true
global-hotkey.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
interprocess.workspace = true
rodio.workspace = true
rubato.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true
velopack.workspace = true
zstd.workspace = true

# The harness's: GPUI drawing offscreen, and the PNGs of what it drew.
gpui_wgpu = { workspace = true, optional = true }
image = { workspace = true, optional = true }

[features]
# `bukospeak-ui`, which draws the window offscreen against staged calls and drives it as a user
# would, for looking at the UI without a display.
harness = ["gpui/test-support", "gpui_platform/test-support", "dep:gpui_wgpu", "dep:image"]

[[bin]]
name = "bukospeak-ui"
required-features = ["harness"]

# On Linux the sound server's devices, named as the system names them and following its default;
# ALSA lists every plug and alias of each card instead.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pulseaudio"] }
ksni.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
bukospeak-server.workspace = true
quinn.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
