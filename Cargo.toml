[workspace]
resolver = "3"
members = ["proto", "core", "ios/ffi", "maxine", "server", "desktop"]
# Upstream crates patched below, built as they are.
exclude = ["vendor"]

[workspace.package]
version = "1.2.1"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/s1adem4n/bukospeak"
license = "GPL-3.0-or-later"

[workspace.dependencies]
bukospeak-core = { path = "core" }
bukospeak-maxine = { path = "maxine" }
bukospeak-proto = { path = "proto" }
bukospeak-server = { path = "server" }
anyhow = "1.0.104"
assert_no_alloc = "1.1.2"
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
cpal = "0.18.2"
ctrlc = "3.5.2"
# DeepFilterNet's inference, trimmed; vendor/README.md says from where and how.
deep_filter = { path = "vendor/deep_filter" }
dirs = "7.0.0"
embed-resource = "3.0.12"
futures = "0.3.34"
global-hotkey = "0.9.0"
# GPUI, Zed's UI framework, as gpui-pre publishes it: weekly snapshots of Zed's main, whose API
# changes, so the versions are exact and an upgrade is a step of its own.
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "wayland", "x11"] }
hound = "3.5.1"
interprocess = "2.4.7"
keyring = "4.2.0"
libloading = "0.9.0"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
nnnoiseless = { version = "0.5.2", default-features = false }
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = [
  "std",
  "AUComponent",
  "AudioComponent",
  "AudioOutputUnit",
  "AudioUnitProperties",
  "objc2-core-audio-types",
] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
opus = { version = "0.4.0", features = ["dred"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
ring = "0.17.14"
rtrb = "0.4.1"
rubato = "5.0.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sonora = "0.2.0"
sonora-agc2 = "0.2.0"
thiserror = "2.0.21"
toml = "1.1.8"
tokio = "1.54.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26.1"
unicode-segmentation = "1.13.3"
# Only the server fetches over HTTP: NVIDIA's effects, from NGC.
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }
# The same version as the `vpk` that packs the app in release.yml, so they agree on the format.
velopack = "=1.3.39-g8d2844f"
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false, features = ["ring", "std"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "0.14.3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Patched copies of published crates; vendor/README.md says what changed and why.
[patch.crates-io]
opus = { path = "vendor/opus" }
sonora = { path = "vendor/sonora" }
sonora-aec3 = { path = "vendor/sonora-aec3" }

# AEC3 and AGC2 in a debug build, with the FFTs and vector arithmetic under them, are too slow
# for the tests' minutes of simulated audio.
[profile.dev.package.sonora]
opt-level = 3
[profile.dev.package.sonora-aec3]
opt-level = 3
[profile.dev.package.sonora-agc2]
opt-level = 3
[profile.dev.package.sonora-ns]
opt-level = 3
[profile.dev.package.sonora-common-audio]
opt-level = 3
[profile.dev.package.sonora-fft]
opt-level = 3
[profile.dev.package.sonora-simd]
opt-level = 3
# Nor can DeepFilterNet3 keep up with the audio in a debug build.
[profile.dev.package.deep_filter]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3

# Downloads stay small: no symbols, and the linker sees across crates to drop what is unused.
[profile.release]
strip = true
lto = "thin"
