[workspace]
resolver = "3"
members = ["proto", "core", "audio/desktop", "audio/ios", "ios/ffi", "server", "desktop"]
# Upstream crates patched below, built as they are.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/s1adem4n/bukospeak"

[workspace.dependencies]
bukospeak-audio-desktop = { path = "audio/desktop" }
bukospeak-audio-ios = { path = "audio/ios" }
bukospeak-core = { path = "core" }
bukospeak-proto = { path = "proto" }
bukospeak-server = { path = "server" }
anyhow = "1.0.104"
assert_no_alloc = "1.1.2"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
cpal = "0.18.2"
ctrlc = "3.5.2"
dirs = "7.0.0"
futures = "0.3.34"
global-hotkey = "0.9.0"
# GPUI and its components; gpui-pre is a weekly snapshot of Zed's main whose API changes, so
# the version is exact and an upgrade is a step of its own.
gpui-kit = "=0.8.0"
interprocess = "2.4.7"
keyring = "4.2.0"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
nnnoiseless = { version = "0.5.2", default-features = false }
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = [
  "std",
  "AUComponent",
  "AudioComponent",
  "AudioOutputUnit",
  "AudioUnitProperties",
  "objc2-core-audio-types",
] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
opus = "0.4.0"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = "0.14.10"
rtrb = "0.4.1"
rubato = "5.0.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sonora = "0.2.0"
sonora-agc2 = "0.2.0"
thiserror = "2.0.21"
toml = "1.1.8"
tray-icon = "0.26.1"
tokio = "1.54.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# sonora as published allocates on every frame; these copies, patched where they do, run on
# the capture callback. vendor/README.md says what changed.
[patch.crates-io]
sonora = { path = "vendor/sonora" }
sonora-aec3 = { path = "vendor/sonora-aec3" }

# AEC3 in a debug build is too slow for the tests' minutes of simulated audio.
[profile.dev.package.sonora]
opt-level = 3
[profile.dev.package.sonora-aec3]
opt-level = 3

# Downloads stay small: no symbols, and the linker sees across crates to drop what is unused.
[profile.release]
strip = true
lto = "thin"
