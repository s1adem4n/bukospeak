language = "C"
header = "/* Generated by cbindgen from ffi/src: `mise run header` rewrites it. */"
include_guard = "BUKOSPEAK_H"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
documentation_style = "doxy"
cpp_compat = false
usize_is_size_t = true

# Of Apple's platforms only iOS builds the crate.
[defines]
"target_os = ios" = "__APPLE__"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
